# nginx site config for IAMS — TLS-terminating reverse proxy that fans
# out to whichever color the symlinked ``upstream.conf`` points at.
# Blue-green swap is a single ``ln -sfn`` + ``nginx -s reload``.

include conf.d/upstream.conf;

# HTTP → HTTPS redirect for everything except the LE acme-challenge.
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name iams.internal staging.iams.internal;

  ssl_certificate     /etc/nginx/certs/iams.crt;
  ssl_certificate_key /etc/nginx/certs/iams.key;
  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # HSTS preload (already set per-response by Django SecurityMiddleware
  # in prod settings, but nginx redundancy is cheap defense in depth).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  client_max_body_size 110m;   # 100MB upload cap + headroom

  # API → backend gunicorn
  location ~ ^/(api|admin|health|ready|metrics|static)/ {
    proxy_pass http://iams_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA → frontend nginx (which handles its own caching)
  location / {
    proxy_pass http://iams_frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
