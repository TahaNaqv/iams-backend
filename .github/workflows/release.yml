name: IAMS Release (blue-green)

# On-prem blue-green pipeline (deploy/ + docker-compose.prod.yml).
# Manual-only: the current deploy path is ./deploy.sh. Needs the
# IAMS_REGISTRY var, REGISTRY_* secrets and STAGING_*/PROD_* secrets.
#
# The frontend image is built from the separate iams-frontend repo, so
# its tag is passed in as an input rather than built here.

on:
  workflow_dispatch:
    inputs:
      deploy_to:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      frontend_image:
        description: "Fully-qualified frontend image ref to deploy alongside"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel mid-deploy

env:
  REGISTRY: ${{ vars.IAMS_REGISTRY || 'harbor.iams.internal' }}
  IMAGE_NAMESPACE: iams

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Build + scan the backend image.
  # ────────────────────────────────────────────────────────────────────
  image:
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.tags.outputs.backend }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          echo "backend=${REGISTRY}/${IMAGE_NAMESPACE}/backend:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.tags.outputs.backend }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy

  # ────────────────────────────────────────────────────────────────────
  # Deploy. `production` is a protected environment (manual approval).
  # ────────────────────────────────────────────────────────────────────
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deploy_to }}
      url: ${{ inputs.deploy_to == 'production' && 'https://iams.internal' || 'https://staging.iams.internal' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via blue-green script
        env:
          DEPLOY_ENV: ${{ inputs.deploy_to }}
          DEPLOY_HOST: ${{ inputs.deploy_to == 'production' && secrets.PROD_HOST || secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ inputs.deploy_to == 'production' && secrets.PROD_USER || secrets.STAGING_USER }}
          DEPLOY_KEY: ${{ inputs.deploy_to == 'production' && secrets.PROD_DEPLOY_KEY || secrets.STAGING_DEPLOY_KEY }}
          BACKEND_IMAGE: ${{ needs.image.outputs.backend_tag }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: ./deploy/blue_green.sh

      - name: Run smoke tests
        env:
          IAMS_BASE_URL: ${{ inputs.deploy_to == 'production' && 'https://iams.internal' || 'https://staging.iams.internal' }}
        run: ./deploy/smoke_test.sh
